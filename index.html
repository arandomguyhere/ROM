<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROM Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ROM Editor</h1>
    <div class="toolbar">
      <button id="openBtn" title="Open ROM file">Open ROM</button>
      <button id="saveBtn" title="Save modified ROM" disabled>Save ROM</button>
      <span class="separator"></span>
      <button id="undoBtn" title="Undo last edit" disabled>Undo</button>
      <button id="redoBtn" title="Redo last edit" disabled>Redo</button>
      <span class="separator"></span>
      <label for="searchInput">Find:</label>
      <input type="text" id="searchInput" placeholder="hex: FF 00 or text" disabled>
      <select id="searchMode" disabled>
        <option value="hex">Hex</option>
        <option value="text">Text</option>
      </select>
      <button id="searchBtn" disabled>Search</button>
      <button id="searchNextBtn" disabled>Next</button>
      <span class="separator"></span>
      <button id="gotoBtn" disabled>Go to Offset</button>
    </div>
  </header>

  <input type="file" id="fileInput" accept=".rom,.bin,.nes,.smc,.sfc,.gb,.gbc,.gba,.n64,.z64,.v64,.nds,.iso,.img,.hex,.sav,*" hidden>

  <main>
    <div id="welcomeScreen">
      <div class="welcome-content">
        <div class="welcome-icon">&#x1F4BE;</div>
        <h2>Welcome to ROM Editor</h2>
        <p>Open a ROM file to begin editing. Supports any binary file format.</p>
        <button id="welcomeOpenBtn">Open ROM File</button>
      </div>
    </div>

    <div id="editorContainer" class="hidden">
      <div class="info-bar">
        <span id="fileInfo">No file loaded</span>
        <span id="selectionInfo"></span>
        <span id="modifiedIndicator" class="hidden">Modified</span>
      </div>

      <div class="editor-layout">
        <div class="offset-gutter" id="offsetGutter"></div>
        <div class="hex-view" id="hexView" tabindex="0"></div>
        <div class="ascii-view" id="asciiView"></div>
      </div>

      <div class="scrollbar-container">
        <input type="range" id="scrollRange" min="0" max="0" value="0" step="1">
      </div>

      <div class="status-bar">
        <span id="cursorOffset">Offset: --</span>
        <span id="cursorValue">Value: --</span>
        <span id="fileSize">Size: --</span>
        <span id="editMode">Mode: Overwrite</span>
      </div>
    </div>
  </main>

  <div id="gotoDialog" class="dialog-overlay hidden">
    <div class="dialog">
      <h3>Go to Offset</h3>
      <label for="gotoInput">Offset (hex):</label>
      <input type="text" id="gotoInput" placeholder="e.g. 1A3F">
      <div class="dialog-buttons">
        <button id="gotoCancelBtn">Cancel</button>
        <button id="gotoOkBtn">Go</button>
      </div>
    </div>
  </div>

  <script src="editor.js"></script>
</body>
</html>
